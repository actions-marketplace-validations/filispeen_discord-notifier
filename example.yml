name: Discord Commit Notification

on:
  push:
    branches:
      - master

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: filispeen/discord-commit-notify@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
